org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# Disable Impeller by default (GPU rendering engine that causes crashes on some devices)
flutter.enableImpeller=false

# Optimize for rendering
android.enableDexingArtifactTransform=true
android.useFullRClassInApp=true

# GPU-related optimizations
android.enableOnDemandDexModules=true
