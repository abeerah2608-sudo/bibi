name: bibi
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.0.0
  bloc: ^9.0.0
  equatable: ^2.0.5
  lottie: ^3.3.2
  dotlottie_loader: ^0.0.5
  url_launcher: ^6.2.0
  just_audio: ^0.10.5
  shared_preferences: ^2.5.5
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.14.4
  permission_handler: ^12.0.1
  audio_session: ^0.2.3
  flutter_cache_manager: ^3.4.1
  sqflite: ^2.4.2
  audio_service: ^0.18.18
  flutter_screenutil: ^5.9.3
  firebase_core: 3.15.2
  cloud_firestore: ^5.6.0
  cached_network_image: ^3.4.1
  firebase_storage: ^12.4.10
  firebase_auth: ^5.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/bibi_icon.png"
  adaptive_icon_background: '#FFF4F4'
  adaptive_icon_foreground: "assets/images/Bibi_Logo_Vector 1.png"
  adaptive_icon_foreground_scale: 0.6 

flutter_native_splash:
  color: "#FFF4F4"
  image: assets/images/Bibi_Logo_Vector 1.png

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/
  fonts:
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
          weight: 600
        - asset: assets/fonts/DMSans_18pt-SemiBold.ttf
          weight: 700
    - family: Edu
      fonts:
        - asset: assets/fonts/EduAUVICWANTHand-SemiBold.ttf
          weight: 700
       
    - family: Inter
      fonts:
       
        - asset: assets/fonts/Inter_18pt-SemiBold.ttf
          weight: 800  